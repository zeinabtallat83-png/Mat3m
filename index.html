 height:50px;

<body>
    <header>
            <img src="set.png" alt="">
            <p>Restaurant SetElbet</p>
 </header>
 <h1> القائمه</h1>

<div class="options">
    <div class="option" ><img src="f1.jpg" ><h2> food1 <h3>10$</h3></h2>
      <label>العدد</label> <input type="number" id="f1"  class="qty" data-name="food1" value="0" min="0">  </div>
    <div class="option" ><img src="f2.jpg" ><h2> food1 <h3>20$</h3></h2>
      <label>العدد</label><input type="number"id="f2" class="qty" data-name="food2" value="0" min="0">  </div>
    <div class="option"><img src="f3.jpg" ><h2> food1 <h3>15$</h3></h2>
      <label>العدد</label><input type="number"id="f3" class="qty" data-name="food3" value="0" min="0">  </div>
    <div class="option" ><img src="f4.jpg" ><h2> food1 <h3>15$</h3></h2>
        <label>العدد</label><input type="number"id="f4" class="qty" data-name="food4" value="0" min="0">  </div>
    <div class="option" ><img src="f5.jpg" ><h2> food1 <h3>10$</h3></h2> 
        <label>العدد</label><input type="number"id="f5" class="qty" data-name="food5" value="0" min="0">  </div>
    <div class="option" ><img src="ff1.jpg" ><h2> food1 <h3>60$</h3></h2> 
        <label>العدد</label><input type="number"id="f6" class="qty" data-name="food6" value="0" min="0">  </div>
    <div class="option" ><img src="ff2.jpg" ><h2> food1 <h3>45$</h3></h2>
         <label>العدد</label><input type="number"id="f7"class="qty" data-name="food7" value="0" min="0">  </div>
    <div class="option"><img src="ff3.jpg" ><h2> food1 <h3>100$</h3></h2> 
        <label>العدد</label><input type="number" id="f8"class="qty" data-name="food8" value="0" min="0">  </div>
 </div>
     <button onclick="calc()">اجمالي الاوردر</button>
       <h4 id="cal"></h4>

   <button class="wats" onclick="sendOrder()"> اطلب علي الواتساب</button>

<script>

function calc(){
  let s1 = parseFloat(document.getElementById('f1').value) || 0;
  let s2 = parseFloat(document.getElementById('f2').value) || 0;
  let s3 = parseFloat(document.getElementById('f3').value) || 0;
  let s4 = parseFloat(document.getElementById('f4').value) || 0;
  let s5 = parseFloat(document.getElementById('f5').value) || 0;
  let s6 = parseFloat(document.getElementById('f6').value) || 0;
  let s7 = parseFloat(document.getElementById('f7').value) || 0;
  let s8 = parseFloat(document.getElementById('f8').value) || 0;

  let sum1 = s1*10;
  let sum2 = s2*20;
  let sum3 = s3*15;
  let sum4 = s4*15;
  let sum5 = s5*10;
  let sum6 = s6*60;
  let sum7 = s7*45;
  let sum8 = s8*100;

  let sum = sum1+sum2+sum3+sum4+sum5+sum6+sum7+sum8;
  document.getElementById('cal').innerHTML = `الاجمالي ${sum}$`;
}

function sendOrder(){
  let allInputs = document.querySelectorAll('.qty');
  let msg = `طلب جديد من مطعم ست البيت\n`;
  let hasOrder = false;

  allInputs.forEach(input=>{
    let count = input.value;
    let name = input.getAttribute('data-name');
    if(count > 0){
      msg += `${name}: العدد ${count}\n`;
      hasOrder = true;
    }
  });

  if(!hasOrder){
    alert("اختار وجبة واحدة على الاقل");
    return;
  }

  let totalText = document.getElementById('cal').innerText;
  msg += `\n${totalText}`;

  let whatsappLink = `https://wa.me/201065667221?text=${encodeURIComponent(msg)}`;
  window.open(whatsappLink, '_blank');
}
    
</script>
